services:
  db:
    image: postgres:16
    container_name: se4all_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: se4all
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/workspace
    working_dir: /workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d se4all"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
